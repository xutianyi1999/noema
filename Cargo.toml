[package]
name = "noema"
version = "0.1.0"
edition = "2024"
description = "OpenCode-driven isolated text knowledge-base service"
license = "MIT"

[dependencies]
anstream = "1"
anstyle = "1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.6.5", features = ["derive", "env"] }
comfy-table = "7"
flate2 = "1.1.9"
futures-util = "0.3"
hex = "0.4"
httpdate = "1"
jsonschema = "0.49.3"
opencode_rs = { git = "https://github.com/allisoneer/agentic_auxilary.git", features = ["http", "sse", "server"] }
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
rmcp = { version = "3.1.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tar = "0.4.46"
tempfile = "3"
termimad = "0.35.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
unicode-truncate = "2.0.1"
unicode-width = "0.2"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2.5"
yaml_serde = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
